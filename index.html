<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the preference before the app bundle loads to avoid a theme flash.
      (() => {
        let preference = 'system'
        try {
          const saved = localStorage.getItem('elenis-traslados:theme')
          if (saved === 'light' || saved === 'dark') preference = saved
        } catch {}
        const systemDark = typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta
      name="description"
      content="Calcula cotizaciones de ida y retorno con tarifas configurables, mapas e historial local."
    />
    <title>Cotizador de traslados</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
